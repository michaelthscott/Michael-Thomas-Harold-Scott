---
layout: page
---
<article class="subject">
  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="subject-image">
  {% endif %}
  <div class="subject-content">
    {{ content }}
  </div>
  
  {% include series-list.html collection=page.series %}
  {% include prev-next.html collection=page.collection %}
</article>
